version: "3"

# NOTE: Before running install-deps, run `sudo -v` to cache your sudo password.
# This allows the install-deps task to run without prompting for password repeatedly.

env:
  TMPDIR: /tmp

tasks:

  install-all:
    desc: Install all system dependencies
    deps:
      - task: install-deps
      - task: install-neovim
      - task: install-R
      - task: install-opencode
      - task: install-quarto
      - task: install-ghostty
      - task: install-wsl
      - task: install-distrobox
    cmds:
      - task: stow

  install-deps:
    desc: Install basic Linux dependencies
    status:
      - which unzip
      - which rg
      - which tree-sitter
      - which stow
      - which fd
    cmds:
      - sudo apt install -y unzip
      - sudo apt install -y ripgrep
      - sudo apt install -y tree-sitter-cli
      - sudo apt install -y stow
      - sudo apt install -y fd-find
      - sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

  install-neovim:
    desc: Install Neovim appimage
    status:
      - which nvim
    cmds:
      - |
        wget -q -O {{.TMPDIR}}/nvim-linux-x86_64.appimage https://github.com/neovim/neovim/releases/download/v0.12.1/nvim-linux-x86_64.appimage
        chmod u+x {{.TMPDIR}}/nvim-linux-x86_64.appimage
        {{.TMPDIR}}/nvim-linux-x86_64.appimage --appimage-extract
        sudo cp -r {{.TMPDIR}}/squashfs-root/usr/bin/nvim /usr/local/bin/
        sudo cp -r {{.TMPDIR}}/squashfs-root/usr/share/nvim /usr/local/share/
        sudo chmod +x /usr/local/bin/nvim
        rm -rf {{.TMPDIR}}/squashfs-root

  install-R:
    desc: Install R with rig
    status:
      - which R
    cmds:
      - |
        sudo apt install -y r-rig
        rig add release
        rig system add-pak
        R -e "pak::pkg_install('xml2')"
        sudo ln -nsf /lib/x86_64-linux-gnu/libxml2.so.2 /lib/x86_64-linux-gnu/libxml2.so.16 2>/dev/null || true
        sudo ln -nsf /lib/x86_64-linux-gnu/libicui18n.so.74 /lib/x86_64-linux-gnu/libicui18n.so.78 2>/dev/null || true
        sudo ln -nsf /lib/x86_64-linux-gnu/libicuuc.so.74 /lib/x86_64-linux-gnu/libicuuc.so.78 2>/dev/null || true
        sudo ln -nsf /lib/x86_64-linux-gnu/libicudata.so.74 /lib/x86_64-linux-gnu/libicudata.so.78 2>/dev/null || true
        sudo ldconfig

  install-quarto:
    desc: Install Quarto
    status:
      - which quarto
    cmds:
      - |
        wget -q -O {{.TMPDIR}}/quarto-1.6.30-linux-amd64.deb https://github.com/quarto-dev/quarto-cli/releases/download/v1.6.30/quarto-1.6.30-linux-amd64.deb
        sudo dpkg -i {{.TMPDIR}}/quarto-1.6.30-linux-amd64.deb || sudo apt --fix-broken install
        rm {{.TMPDIR}}/quarto-1.6.30-linux-amd64.deb

  install-opencode:
    desc: Install opencode CLI tool
    status:
      - which opencode
    cmds:
      - |
        wget -q -O {{.TMPDIR}}/opencode-linux-x64.tar.gz https://github.com/anomalyco/opencode/releases/download/v1.4.1/opencode-linux-x64.tar.gz
        tar -xzf {{.TMPDIR}}/opencode-linux-x64.tar.gz -C {{.TMPDIR}}
        sudo cp {{.TMPDIR}}/opencode /usr/local/bin/
        sudo chmod +x /usr/local/bin/opencode
        rm {{.TMPDIR}}/opencode-linux-x64.tar.gz {{.TMPDIR}}/opencode

  install-ghostty:
    desc: Install Ghostty terminal
    status:
      - which ghostty
    cmds:
      - /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh)"

  install-wsl:
    desc: WSL-specific setup (win32yank clipboard)
    if: test -n "$WSL_DISTRO_NAME" || test -f /proc/sys/fs/binfmt_misc/WSLInterop
    deps:
      - task: install-ghostty
    cmds:
      - task: install-wsl-clipboard

  install-wsl-clipboard:
    desc: Install win32yank for WSL clipboard
    status:
      - test -f ~/.local/bin/win32yank.exe
    cmds:
      - |
        mkdir -p ~/.local/bin
        curl -sLo ~/.local/bin/win32yank.zip https://github.com/equalsraf/win32yank/releases/download/v0.0.4/win32yank-x64.zip
        unzip -p ~/.local/bin/win32yank.zip win32yank.exe > ~/.local/bin/win32yank.exe
        chmod +x ~/.local/bin/win32yank.exe
        rm ~/.local/bin/win32yank.zip

  install-distrobox:
    desc: Distrobox-specific setup (clipboard + export to host)
    if: test -n "$CONTAINER_ID" || test -f /run/.containerenv
    deps:
      - task: install-ghostty
    cmds:
      - task: install-distrobox-clipboard
      - task: export-to-host

  install-distrobox-clipboard:
    desc: Install clipboard tool for Distrobox
    cmds:
      - |
        if [ "$XDG_SESSION_TYPE" = "wayland" ]; then
          sudo apt install -y wl-clipboard
        else
          sudo apt install -y xclip
        fi

  export-to-host:
    desc: Export installed apps to host system (Distrobox)
    cmds:
      - distrobox-export --app ghostty || echo "distrobox-export not available or already exported"

  stow:
    desc: Create symlinks for all dotfiles packages
    deps: []
    dir: ~/projects/dotfiles
    cmds:
      - stow git nvim config node quarto
